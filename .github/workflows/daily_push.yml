name: AI HOT Daily Push

on:
  schedule:
    # 根据历史延迟约10-11小时
    # 目标：北京时间 8:30-10:30 执行
    # 计算：UTC 14:30 + 10小时延迟 ≈ UTC 00:30 ≈ 北京时间 8:30
    - cron: '30 14 * * *'  # UTC 14:30 → 预计北京时间 0:30+10h ≈ 10:30
    - cron: '0 15 * * *'   # UTC 15:00 → 预计北京时间 1:00+10h ≈ 11:00
    - cron: '30 15 * * *'  # UTC 15:30 → 预计北京时间 1:30+10h ≈ 11:30
  workflow_dispatch:  # 手动触发

jobs:
  push-daily:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run push script
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python fetch_and_push.py
      
      - name: Log completion
        run: echo "Daily push completed at $(date)"
