name: AI HOT Daily Push

on:
  schedule:
    # 目标：北京时间早上 9:00 推送
    # 实测：UTC 23:30 → 北京时间约 9:00
    # 
    # 中午12点的推送不在配置中，可能是 GitHub Actions 延迟问题
    # 简化为单一触发时间
    - cron: '30 23 * * *'  # UTC 23:30 → 北京时间约 9:00
  workflow_dispatch:  # 手动触发

jobs:
  push-daily:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run push script
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python fetch_and_push.py
      
      - name: Log completion
        run: echo "Daily push completed at $(date)"
