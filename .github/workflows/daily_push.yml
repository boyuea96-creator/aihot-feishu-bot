name: AI HOT Daily Push

on:
  schedule:
    # 目标：北京时间 9:00 和 10:00 各推送一次
    # 实测数据：
    # - UTC 14:30 → 北京时间 1:00-4:00（延迟2.5-3.5小时）
    # - UTC 21:30-23:30 → 北京时间 6:00-8:30（延迟0.5-1小时）
    # - UTC 23:30 → 北京时间 8:56（延迟约1.5小时）
    # 结论：延迟约1-1.5小时
    # 
    # 推算：
    # - 9:00 北京时间 = UTC 1:00，减去1.5小时延迟 = UTC 23:30
    # - 10:00 北京时间 = UTC 2:00，减去1小时延迟 = UTC 1:00
    - cron: '30 23 * * *'  # UTC 23:30 → 北京时间约 9:00
    - cron: '0 1 * * *'    # UTC 01:00 → 北京时间约 10:00
  workflow_dispatch:  # 手动触发

jobs:
  push-daily:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run push script
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python fetch_and_push.py
      
      - name: Log completion
        run: echo "Daily push completed at $(date)"
