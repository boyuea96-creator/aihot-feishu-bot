name: AI HOT Daily Push

on:
  schedule:
    # 历史延迟约10小时：配置UTC 22:30 → 执行UTC 08:30
    # 目标：北京时间 8:30-10:30 (UTC 0:30-2:30)
    # 配置：UTC 0:30-2:30 - 10小时 = UTC 前一天 14:30-16:30
    - cron: '30 14 * * *'  # UTC 14:30 + 10h延迟 → UTC 00:30 ≈ 北京 8:30
    - cron: '0 15 * * *'   # UTC 15:00 + 10h延迟 → UTC 01:00 ≈ 北京 9:00
    - cron: '30 15 * * *'  # UTC 15:30 + 10h延迟 → UTC 01:30 ≈ 北京 9:30
    - cron: '0 16 * * *'   # UTC 16:00 + 10h延迟 → UTC 02:00 ≈ 北京 10:00
    - cron: '30 16 * * *'  # UTC 16:30 + 10h延迟 → UTC 02:30 ≈ 北京 10:30
  workflow_dispatch:  # 手动触发

jobs:
  push-daily:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run push script
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python fetch_and_push.py
      
      - name: Log completion
        run: echo "Daily push completed at $(date)"
