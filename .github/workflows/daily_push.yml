name: AI HOT Daily Push

on:
  schedule:
    # 目标：北京时间 8:30-10:30 推送
    # 实测：UTC 14:30 配置 → 北京时间 1:00 触发，延迟约 2.5-3 小时
    # 推算：北京时间 8:30 = UTC 0:30，需提前 3 小时配置
    # UTC 21:30 + 3小时延迟 ≈ UTC 0:30 = 北京时间 8:30
    - cron: '30 21 * * *'  # UTC 21:30 → 北京时间约 8:30
    - cron: '0 22 * * *'   # UTC 22:00 → 北京时间约 9:00
    - cron: '30 22 * * *'  # UTC 22:30 → 北京时间约 9:30
    - cron: '0 23 * * *'   # UTC 23:00 → 北京时间约 10:00
    - cron: '30 23 * * *'  # UTC 23:30 → 北京时间约 10:30
  workflow_dispatch:  # 手动触发

jobs:
  push-daily:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run push script
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python fetch_and_push.py
      
      - name: Log completion
        run: echo "Daily push completed at $(date)"
