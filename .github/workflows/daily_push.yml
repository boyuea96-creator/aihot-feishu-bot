name: AI HOT Daily Push

on:
  schedule:
    # 根据历史数据，GitHub Actions 延迟约 10 小时
    # 要北京时间 8:30-10:30 执行，需配置 UTC 前一天 22:30-00:30
    - cron: '30 22 * * *'  # UTC 22:30 → 预计北京时间 8:30-10:30
    - cron: '0 23 * * *'   # UTC 23:00 → 预计北京时间 9:00-11:00
    - cron: '30 23 * * *'  # UTC 23:30 → 预计北京时间 9:30-11:30
    - cron: '0 0 * * *'    # UTC 0:00 → 预计北京时间 10:00-12:00
    - cron: '30 0 * * *'   # UTC 0:30 → 预计北京时间 10:30-12:30
  workflow_dispatch:  # 手动触发

jobs:
  push-daily:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run push script
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python fetch_and_push.py
      
      - name: Log completion
        run: echo "Daily push completed at $(date)"
