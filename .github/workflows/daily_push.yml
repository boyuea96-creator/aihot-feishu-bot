name: AI HOT Daily Push

on:
  schedule:
    # 目标：北京时间 8:30-10:30 推送
    # 北京时间 = UTC + 8 小时
    # 北京时间 8:30 = UTC 0:30
    # 北京时间 10:30 = UTC 2:30
    - cron: '30 0 * * *'  # UTC 00:30 → 北京时间 8:30
    - cron: '0 1 * * *'   # UTC 01:00 → 北京时间 9:00
    - cron: '30 1 * * *'  # UTC 01:30 → 北京时间 9:30
    - cron: '0 2 * * *'   # UTC 02:00 → 北京时间 10:00
    - cron: '30 2 * * *'  # UTC 02:30 → 北京时间 10:30
  workflow_dispatch:  # 手动触发

jobs:
  push-daily:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run push script
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python fetch_and_push.py
      
      - name: Log completion
        run: echo "Daily push completed at $(date)"
