name: AI HOT Daily Push

on:
  schedule:
    # 北京时间 6:30 (UTC 22:30)，应对 GitHub Actions 延迟
    # 预计实际执行时间：北京时间 8:30-9:30
    - cron: '30 22 * * *'
  workflow_dispatch:  # 手动触发

jobs:
  push-daily:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run push script
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python fetch_and_push.py
      
      - name: Log completion
        run: echo "Daily push completed at $(date)"
