name: AI HOT Daily Push

on:
  schedule:
    # 目标：北京时间 8:30-10:30 推送
    # 实测1：UTC 14:30-16:30 → 北京时间 1:00-4:00（延迟2.5-3.5小时）
    # 实测2：UTC 21:30-23:30 → 北京时间 6:00-8:30（延迟0.5-1小时）
    # 结论：延迟不稳定，约0.5-3小时范围
    # 最新实测延迟约0.5-1小时，按提前1小时配置
    # UTC 23:30 + 1小时延迟 ≈ UTC 0:30 = 北京时间 8:30
    - cron: '30 23 * * *'  # UTC 23:30 → 北京时间约 8:30
    - cron: '0 0 * * *'    # UTC 00:00 → 北京时间约 9:00
    - cron: '30 0 * * *'   # UTC 00:30 → 北京时间约 9:30
    - cron: '0 1 * * *'    # UTC 01:00 → 北京时间约 10:00
    - cron: '30 1 * * *'   # UTC 01:30 → 北京时间约 10:30
  workflow_dispatch:  # 手动触发

jobs:
  push-daily:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run push script
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python fetch_and_push.py
      
      - name: Log completion
        run: echo "Daily push completed at $(date)"
